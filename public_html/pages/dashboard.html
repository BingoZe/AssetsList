    <div class="mainPage">
        <div class="mainHeader">
            <h2>DwemerWorks Dashboard</h2>
        </div>
        <div class="mainContainer">
            <div class="chartContainer">
                
                <div class="assetCharts">
                    <canvas id ="typeChart"></canvas>                       
                </div>
               
                <div class="assetCharts">
                    <canvas id ="locationChart"></canvas>                       
                </div>
                
                <div class="assetCharts">
                    <canvas id ="statusChart"></canvas>                       
                </div>                

                <div class="assetCharts">
                    <canvas id ="yearChart"></canvas>                       
                </div>                
                          
            </div>
            
            <div class="stats">

                <!-- Total Assets -->
                <div class="statsSubcontainer" id="totalAssets">

                    <div class="statsIcon" id="totalAssetsIcon">
                        <svg viewBox="0 0 64 64" width="28" height="28">
                            <rect x="12" y="18" width="40" height="30" rx="4"
                                  fill="#E8F0FF"
                                  stroke="#4E73DF"
                                  stroke-width="2"/>

                            <path d="M12 26H52"
                                  stroke="#4E73DF"
                                  stroke-width="2"/>

                            <path d="M32 18V48"
                                  stroke="#4E73DF"
                                  stroke-width="2"/>
                        </svg>
                    </div>

                    <div class="statsCaption">
                        <p>Total assets</p>
                    </div>

                    <div class="figures" id="totalAssetsFigures"></div>
                </div>



                <!-- Repairing -->
                <div class="statsSubcontainer" id="repairAssets">

                    <div class="statsIcon" id="repairingIcon">
                        <svg viewBox="0 0 64 64" width="28" height="28">
                            <circle cx="25"
                                    cy="25"
                                    r="8"
                                    fill="#E8F0FF"
                                    stroke="#4E73DF"
                                    stroke-width="2"/>

                            <path d="M30 30L46 46"
                                  stroke="#4E73DF"
                                  stroke-width="4"
                                  stroke-linecap="round"/>

                            <circle cx="49"
                                    cy="49"
                                    r="4"
                                    fill="#4E73DF"/>
                        </svg>
                    </div>

                    <div class="statsCaption">
                        <p>Assets being repaired</p>
                    </div>

                    <div class="figures" id="repairingFigures"></div>
                </div>



                <!-- Available -->
                <div class="statsSubcontainer" id="availableAssets">

                    <div class="statsIcon" id="availableIcon">
                        <svg viewBox="0 0 64 64" width="28" height="28">
                            <circle cx="32"
                                    cy="32"
                                    r="20"
                                    fill="#E8F0FF"
                                    stroke="#4E73DF"
                                    stroke-width="2"/>

                            <path d="M22 33L29 40L43 25"
                                  fill="none"
                                  stroke="#4E73DF"
                                  stroke-width="4"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <div class="statsCaption">
                        <p>Available assets</p>
                    </div>

                    <div class="figures" id="availableFigures"></div>
                </div>



                <!-- Net Value -->
                <div class="statsSubcontainer" id="netValueAssets">

                    <div class="statsIcon" id="netValueIcon">
                        <svg viewBox="0 0 64 64" width="28" height="28">
                            <circle cx="32"
                                    cy="32"
                                    r="20"
                                    fill="#E8F0FF"
                                    stroke="#4E73DF"
                                    stroke-width="2"/>

                            <text x="32"
                                  y="40"
                                  text-anchor="middle"
                                  font-size="24"
                                  fill="#4E73DF"
                                  font-family="Arial, sans-serif">
                                €
                            </text>
                        </svg>
                    </div>

                    <div class="statsCaption">
                        <p>Net value of assets</p>
                    </div>

                    <div class="figures" id="netValueFigures"></div>
                </div>

            </div>
            
        </div>              
    </div>
