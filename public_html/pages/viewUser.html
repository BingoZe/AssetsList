<div class="mainPage">
    
    <div class="mainHeader">

        <div class="headerTitle">
            <h2>View User</h2>
        </div>
        
        <div class="headerNav">
            <ul class ="headerUl">
                <li>User General info</li>
            </ul>
        </div>
    </div>
    
    <div class="formContainer">
        <form class="user-form">
            <div id="generalTab" class="tabcontent">
            <!-- ################################################################################## -->
            <!-- GENERAL INFO   ################################################################### -->
            <!-- ################################################################################## -->
            <fieldset class="formSection">
                <legend class="formLegends">General Information</legend>
               
                <div class="form-group">
                    <label for="userId">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        name="userId">
                </div>
                
                <div class="form-group">
                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        required>
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        required>
                </div>

                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail">
                </div>   

                 
                <div class="form-group">
                    <label for="userStatus">
                        Status
                    </label>

                    <select id="userStatus" class="userStatus">
                        <option id="typeActive">Active</option>
                        <option id="typeInactive">Inactive</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="userType">
                        Type
                    </label>

                    <select id="userType" class="userType">
                        <option id="typeTechnician">Technician</option>
                        <option id="typeAuditor">Auditor</option>
                        <option id="typeEnduser">End User</option>
                    </select>
                </div>  
                
                
               <div class="form-group">
                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        required>
                </div>
                
               <div class="form-group">
                    <label for="role">
                        Role
                    </label>

                    <input
                        type="text"
                        id="role"
                        name="role"
                        required>
                </div>
                  
            </fieldset>
            
            </div>
            
                <div class="formButtons">
                    
                    <button type="button" id="close" onclick="closeViewUser()">
                        Close
                    </button>    
                    
                    <button type="submit">
                        Save
                    </button>
                </div>
                
        </form>
    </div>
    
    
    
</div>
