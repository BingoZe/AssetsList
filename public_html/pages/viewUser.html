<div class="mainPage">
    
    <div class="mainHeader">

        <div class="headerTitle">
            <h2>VIEW USER</h2>
        </div>
        
        <div class="headerNav">
            <ul class ="headerUl">
                <li>User info</li>
            </ul>
        </div>
    </div>
    
    <div class="formContainer">
        <form class="user-form">
            <div id="generalTab" class="tabcontent">
            <!-- ################################################################################## -->
            <!-- GENERAL INFO   ################################################################### -->
            <!-- ################################################################################## -->
            <fieldset class="formSection">
                <legend class="formLegends">General Information</legend>
               
                                
                <div class="form-group">
                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        required>
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        required>
                </div>

                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail">
                </div>   

                 
                <div class="form-group">
                    <label for="userStatusSelect">
                        Status
                    </label>

                    <select id="userStatusSelect" class="userStatusSelect">

                    </select>
                </div>
                
                <div class="form-group">
                    <label for="userTypeSelect">
                        Type
                    </label>

                    <select id="userTypeSelect" class="userTypeSelect">
                    </select>
                </div>  
                
                
               <div class="form-group">
                    <label for="departmentSelect">
                        Department
                    </label>

                    <select
                        id="departmentSelect"
                        name="departmentSelect"
                        required>
                    </select>
                </div>
                
               <div class="form-group">
                    <label for="userRoleSelect">
                        Role
                    </label>

                    <select
                        id="userRoleSelect"
                        name="userRoleSelect"
                        required>
                    </select>
                </div>
                  
            </fieldset>
            <fieldset>
                    
                    <legend class="formLegends">
                        Assets assigned
                    </legend>                    

                    <table class="allAssets" id="assetHistoryTable">

                        <thead class="tableHeader">

                            <tr>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Asset ID</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Asset</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Type</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Status</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Deploy Date</span>
                                    </div>
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tableBodyAssetHistory" class="tableBodyAssetHistory">
                        </tbody>

                    </table>

                </fieldset>
            </div>
            
                <div class="formButtons">
                    
                    <button type="button" id="close" onclick="closeViewUser()">
                        Close
                    </button>    
                    
                    <button type="submit" id="resave" class="resave">
                        Save
                    </button>
                </div>
                
        </form>
    </div>
    
    
    
</div>
