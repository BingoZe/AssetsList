<div class="mainPage">

    <div class="mainHeader">

        <div class="headerTitle">
            <h2>APPLICATION SETTINGS</h2>
        </div>

    </div>

    <div class="formContainer">

        <form>

            <fieldset class="formSection">

                <legend class="formLegends">
                    System Preferences
                </legend>

                <div class="form-group">

                    <label for="financialYearEnd">
                        Financial Year End
                    </label>

                    <select id="financialYearEnd">
                        <option>31 December</option>
                        <option>30 June</option>
                        <option>31 March</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="currency">
                        Default Currency
                    </label>

                    <select id="currency">
                        <option>EUR (€)</option>
                        <option>GBP (£)</option>
                        <option>USD ($)</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="depreciationRate">
                        Default Depreciation Rate (%)
                    </label>

                    <input
                        type="number"
                        id="depreciationRate"
                        value="20">

                </div>

                <div class="form-group">

                    <label for="usefulLife">
                        Default Useful Life (Years)
                    </label>

                    <input
                        type="number"
                        id="usefulLife"
                        value="5">

                </div>

                <!-- DEFAULT ASSET TYPES -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Default Asset Types</label>

                        <button
                            type="button"
                            class="settingsButton addSetting">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editSetting">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeSetting">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="typeContainer 
                             settingsContainer"></div>

                    </div>

                    <select id="typeSelect">
                    </select>

                </div>

                <!-- DEFAULT ASSET STATUS -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Default Asset Status</label>

                        <button
                            type="button"
                            class="settingsButton addAssetStatus">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editAssetStatus">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeAssetStatus">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="assetStatusContainer 
                             settingsContainer"></div>

                    </div>

                    <select id="statusSelect">
                    </select>

                </div>

                <!-- DEFAULT LOCATIONS -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Default Locations</label>

                        <button
                            type="button"
                            class="settingsButton addLocation">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editLocation">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeLocation">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="locationContainer
                             settingsContainer"></div>

                    </div>

                    <select id="locationSelect">
                    </select>

                </div>

                <!-- MAINTENANCE STATUS -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Maintenance Status</label>

                        <button
                            type="button"
                            class="settingsButton addMaintenanceStatus">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editMaintenanceStatus">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeMaintenanceStatus">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="maintenanceStatusContainer
                             settingsContainer"></div>

                    </div>

                    <select id="maintenanceStatus">
                    </select>

                </div>

                <!-- MAINTENANCE CATEGORY -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Maintenance Category</label>

                        <button
                            type="button"
                            class="settingsButton addMaintenanceCategory">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editMaintenanceCategory">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeMaintenanceCategory">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="maintenanceCategoryContainer
                             settingsContainer"></div>

                    </div>

                    <select id="maintenanceCategory">
                    </select>

                </div>

                <!-- MAINTENANCE PRIORITY -->

                <div class="form-group">

                    <div class="settingsSubField">

                        <label>Maintenance Priority</label>

                        <button
                            type="button"
                            class="settingsButton addMaintenancePriority">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton editMaintenancePriority">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <button
                            type="button"
                            class="settingsButton removeMaintenancePriority">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <div class="maintenancePriorityContainer
                             settingsContainer"></div>

                    </div>

                    <select id="maintenancePriority">
                    </select>

                </div>

            </fieldset>

            <fieldset class="formSection">

                <legend class="formLegends">
                    Company Information
                </legend>

                <div class="form-group">

                    <label for="companyName">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="companyName">

                </div>

                <div class="form-group">

                    <label for="companyEmail">
                        Company Email
                    </label>

                    <input
                        type="email"
                        id="companyEmail">

                </div>

                <div class="form-group">

                    <label for="companyPhone">
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="companyPhone">

                </div>

                <div class="form-group">

                    <label for="companyAddress">
                        Address
                    </label>

                    <input
                        type="text"
                        id="companyAddress">

                </div>

            </fieldset>

            <fieldset class="description">

                <div class="form-group">

                    <label for="settingsNotes">
                        Notes
                    </label>

                    <textarea
                        id="settingsNotes"
                        class="notes">
                    </textarea>

                </div>

            </fieldset>

            <div class="formButtons">

                <button
                    type="reset"
                    class="buttonExport">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btnPrimary">

                    Save Settings

                </button>

            </div>

        </form>

    </div>

</div>
