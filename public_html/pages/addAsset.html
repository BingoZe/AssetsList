<div class="page-add-asset">
    
    <div class="AddAssetHeader">
        
        
        <div class="headerTitle">
            <h2>Add Asset</h2>
        </div>
        
        
        <div class="headerNav">
            <ul class ="headerUl">
                <li><a href="#" class="tabLinks" onclick="openTab(event,'generalTab')">General</a></li>
                <li><a href="#" class="tabLinks" onclick="openTab(event,'warrantyTab')">Warranty</a></li>
                <li><a href="#">Financial</a></li>
                <li><a href="#">Repair History</a></li>
            </ul>
        </div>
    </div>
    
    <div class="addAssetContainer">
        <form class="asset-form">
            <div id="generalTab" class="tabcontent">
            <!-- ################################################################################## -->
            <!-- GENERAL INFO   ################################################################### -->
            <!-- ################################################################################## -->
            <fieldset class="generalInfo">
                <legend class="formLegends">General Information</legend>
                
                <!--Item 1-->
                <div class="form-group">
                    <label for="assetId">
                        Asset ID
                    </label>

                    <input
                        type="text"
                        id="assetId"
                        name="assetId">
                </div>


                <!--Item 2-->
                <div class="form-group">
                    <label for="assetName">
                        Asset Name
                    </label>

                    <input
                        type="text"
                        id="assetName"
                        name="assetName">
                </div>


                <!--Item 3-->
                <div class="form-group">
                    <label for="serviceTag">
                        Service Tag
                    </label>

                    <input
                        type="text"
                        id="serviceTag"
                        name="serviceTag">
                </div>

                <!--Item 3-->
                <div class="form-group">
                    <label for="Model">
                        Model
                    </label>

                    <input
                        type="text"
                        id="Model"
                        name="Model">
                </div>
                
                
                
                <!--Item 4-->
                <div class="form-group">
                    <label for="type">
                        Type
                    </label>

                    <select id="type" class="typeSelect">

                        <option id="typeLaptop">
                            Laptop
                        </option>

                        <option id="typeMobile">
                            Mobile
                        </option>

                    </select>
                </div>  
                
                <!--Item 5-->
                <div class="form-group">
                    <label for="acquisitionDate">
                        Acquisition Date
                    </label>

                    <input
                        type="date"
                        id="acquisitionDate"
                        name="acquisitionDate">
                </div>

                <!--Item 6-->
                <div class="form-group">
                    <label for="acquisitionvalue">
                        Acquisition Value
                    </label>

                    <input
                        type="number"
                        id="acquisitionvalue"
                        name="acquisitionvalue">
                </div>
                <!--Item 6-->                <div class="form-group">
                    <label for="assetStatus">
                        Status
                    </label>

                    <select id="assetStatus" class="statusSelect">
                        <option id="statusActive">Active</option>
                        <option id="statusInactive">Inactive</option>
                        <option id="statusRepairing">Repairing</option>
                        <option id="statusRetired">Retired</option>
                        <option id="statusLost">Lost</option>
                        
                        
                    </select>
                </div>
            </fieldset>
            
            <!-- ################################################################################## -->
            <!-- OWNER & LOCATION  ################################################################### -->
            <!-- ################################################################################## -->        
            
            <fieldset class="OwnerLocation">
                <legend class="formLegends">Owner & Location</legend>
                <!--Item 7-->
                <div class="form-group">
                    <label for="user">
                        User
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user">
                </div>

        
                <!--Item 7-->
                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail">
                </div>
                <!--Item 7-->
                <div class="form-group">
                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location">
                </div>

        
            </fieldset>
            
            
            <!-- ################################################################################## -->
            <!-- NOTES ################################################################### -->
            <!-- ################################################################################## -->        
                        
            
            <fieldset class="description">
                <!--Item 7-->
                <div class="form-group">
                    <label for="notes">
                        Additional Notes
                    </label>

                    <textarea class="notes"
                        id="notes"
                        name="notes">
                    </textarea>

                </div>
            </fieldset>
            </div>
            
            <div id="warrantyTab" class="tabcontent">
            <!-- ################################################################################## -->
            <!-- WARRANTY#####  ################################################################### -->
            <!-- ################################################################################## -->  
            
             <fieldset class="test">
                <!--Item 7-->
                <div class="form-group">
                    <label for="test">
                        Test
                    </label>

                    <textarea class="test"
                        id="test"
                        name="test">
                    </textarea>

                </div>
            </fieldset>           
            
            
            
            
            
            </div>
                <!--Item 8-->
                <div class="saveBtn">
                    <button type="submit">
                        Save Asset
                    </button>
                </div>
                
        </form>
    </div>
    
    
    
</div>
