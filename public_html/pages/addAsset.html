<h2>Add Asset</h2>

<form class="asset-form">

    <label for="assetName">
        Asset Name
    </label>

    <input
        type="text"
        id="assetName"
        name="assetName">

    <br><br>

    <label for="description">
        Description
    </label>

    <textarea
        id="description"
        name="description">
    </textarea>

    <br><br>

    <label for="category">
        Category
    </label>

    <select id="category">

        <option>
            Hardware
        </option>

        <option>
            Software
        </option>

    </select>

    <br><br>

    <button type="submit">
        Save Asset
    </button>

</form>
