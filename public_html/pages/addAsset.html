<div class="page-add-asset">
    <h2>Add Asset</h2>
    

    <form class="asset-form">

        <label for="assetId">
            Asset ID
        </label>

        <input
            type="text"
            id="assetId"
            name="assetId">

        <br>

        <label for="assetName">
            Asset Name
        </label>

        <input
            type="text"
            id="assetName"
            name="assetName">

        <br><br>

        <label for="serviceTag">
            Service Tag
        </label>

        <input
            type="text"
            id="serviceTag"
            name="serviceTag">

        <br>

        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            name="description">
        </textarea>

        <br>

        <label for="category">
            Category
        </label>

        <select id="category">

            <option>
                Hardware
            </option>

            <option>
                Software
            </option>

        </select>

        <br>

        <button type="submit">
            Save Asset
        </button>

    </form>
</div>
