<div class="page-add-asset">
    
    <div class="AddAssetHeader">
        <h2>Add Asset</h2>
    </div>
    
    <div class="addAssetContainer">
        <form class="asset-form">
            
            <!-- ################################################################################## -->
            <!-- GENERAL INFO   ################################################################### -->
            <!-- ################################################################################## -->
            <fieldset class="generalInfo">
                <legend class="formLegends">General Information</legend>
                
                <!--Item 1-->
                <div class="form-group">
                    <label for="assetId">
                        Asset ID
                    </label>

                    <input
                        type="text"
                        id="assetId"
                        name="assetId">
                </div>


                <!--Item 2-->
                <div class="form-group">
                    <label for="assetName">
                        Asset Name
                    </label>

                    <input
                        type="text"
                        id="assetName"
                        name="assetName">
                </div>


                <!--Item 3-->
                <div class="form-group">
                    <label for="serviceTag">
                        Service Tag
                    </label>

                    <input
                        type="text"
                        id="serviceTag"
                        name="serviceTag">
                </div>

                <!--Item 4-->
                <div class="form-group">
                    <label for="type">
                        Type
                    </label>

                    <select id="type" class="typeSelect">

                        <option>
                            Hardware
                        </option>

                        <option>
                            Software
                        </option>

                    </select>
                </div>  
                
                <!--Item 5-->
                <div class="form-group">
                    <label for="acquisitionDate">
                        Acquisition Date
                    </label>

                    <input
                        type="date"
                        id="acquisitionDate"
                        name="acquisitionDate">
                </div>

                <!--Item 6-->
                <div class="form-group">
                    <label for="acquisitionvalue">
                        Acquisition Value
                    </label>

                    <input
                        type="number"
                        id="acquisitionvalue"
                        name="acquisitionvalue">
                </div>
                <!--Item 6-->
                <div class="form-group">
                    <label for="assetStatus">
                        Status
                    </label>

                    <select id="assetStatus" class="statusSelect">
                        <option>Active</option>
                        <option>Inactive</option>
                        <option>Repairing</option>
                        <option>Retired</option>
                        <option>Lost</option>
                        
                        
                    </select>
                </div>
            </fieldset>
            
            <!-- ################################################################################## -->
            <!-- OWNER & LOCATION  ################################################################### -->
            <!-- ################################################################################## -->        
            
            <fieldset class="OwnerLocation">
                <legend class="formLegends">Owner & Location</legend>
                <!--Item 7-->
                <div class="form-group">
                    <label for="user">
                        User
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user">
                </div>

        
                <!--Item 7-->
                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail">
                </div>
                <!--Item 7-->
                <div class="form-group">
                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location">
                </div>

        
            </fieldset>
            
            
            <!-- ################################################################################## -->
            <!-- NOTES ################################################################### -->
            <!-- ################################################################################## -->        
                        
            
            <fieldset class="description">
                <!--Item 7-->
                <div class="form-group">
                    <label for="notes">
                        Additional Notes
                    </label>

                    <textarea class="notes"
                        id="notes"
                        name="notes">
                    </textarea>

                </div>
            </fieldset>
                <!--Item 8-->
                <div class="saveBtn">
                    <button type="submit">
                        Save Asset
                    </button>
                </div>

        </form>
    </div>
    
    
    
</div>
