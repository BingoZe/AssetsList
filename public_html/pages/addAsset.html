<div class="page-add-asset">
    
    <div class="AddAssetHeader">
        <h2>Add Asset</h2>
    </div>
    
    <div class="addAssetContainer">
        <form class="asset-form">
            
            <!--Item 1-->
            <div class="form-group">
                <label for="assetId">
                    Asset ID
                </label>

                <input
                    type="text"
                    id="assetId"
                    name="assetId">
            </div>
            
            
            <!--Item 2-->
            <div class="form-group">
                <label for="assetName">
                    Asset Name
                </label>

                <input
                    type="text"
                    id="assetName"
                    name="assetName">
            </div>
            
            
            <!--Item 3-->
            <div class="form-group">
                <label for="serviceTag">
                    Service Tag
                </label>

                <input
                    type="text"
                    id="serviceTag"
                    name="serviceTag">
            </div>
            
            <!--Item 4-->
            <div class="form-group">
                <label for="user">
                    User
                </label>

                <input
                    type="text"
                    id="user"
                    name="user">
            </div>
            
            <!--Item 5-->
            <div class="form-group">
                <label for="type">
                    Type
                </label>

                <select id="type">

                    <option>
                        Hardware
                    </option>

                    <option>
                        Software
                    </option>

                </select>
            </div>
            
            <!--Item 5-->
            <div class="form-group">
                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes">
                </textarea>

            </div>
            
            <!--Item 6-->
            <div class="saveBtn">
                <button type="submit">
                    Save Asset
                </button>
            </div>
            
        </form>
    </div>
    
    
    
</div>
