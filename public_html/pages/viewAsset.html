<!-- Essa pagina e apenas uma copia para leitura da pagina AddAsset -->

<div class="mainPage">
    
    <div class="mainHeader">
        
        <div class="headerTitle">
            <h2>VIEW ASSET</h2>
        </div>
        
        <div class="headerNav">
            <ul class ="headerUl">
                <li><a href="#" 
                       class="tablinks" 
                       onclick="openTab(event,'generalTab')">
                        General</a></li>
                <li><a href="#" 
                       class="tablinks" 
                       onclick="openTab(event,'warrantyTab')">
                        Warranty</a></li>
                <li><a href="#"
                       class="tablinks" 
                       onclick="openTab(event,'financialTab')">
                        Financial</a></li>
                <li>
                    <a href="#"
                       class="tablinks"
                       onclick="openTab(event,'maintenanceTab')">
                        Maintenance History
                    </a>
                </li>
            </ul>
        </div>
    </div>
    
    <div class="formContainer">
        <form class="asset-form">
            <div id="generalTab" class="tabcontent">
            
            <!-- GENERAL INFO   ####################################### -->
         
            <fieldset class="formSection">
                <legend class="formLegends">General Information</legend>
                
                <div class="form-group">
                    <label for="assetId">
                        Asset ID
                    </label>

                    <input
                        type="text"
                        id="assetId"
                        name="assetId"
                        readonly
                        disabled
                        >
                </div>

                <div class="form-group">
                    <label for="assetName">
                        Asset Name
                    </label>

                    <input
                        type="text"
                        id="assetName"
                        name="assetName">
                </div>

                <div class="form-group">
                    <label for="serviceTag">
                        Service Tag
                    </label>

                    <input
                        type="text"
                        id="serviceTag"
                        name="serviceTag">
                </div>

                <div class="form-group">
                    <label for="model">
                        Model
                    </label>

                    <input
                        type="text"
                        id="model"
                        name="model">
                </div>
                                
                <div class="form-group">
                    <label for="type">
                        Type
                    </label>

                    <select id="type" class="typeSelect">

                        <option id="typeLaptop">Laptop</option>
                        <option id="typeMobile">Mobile</option>
                        <option id="typeServer">Server</option>
                        <option id="typeVirtualDesktop">Virtual Desktop</option>
                        <option id="typeDesktop">Desktop</option>
                        <option id="typeMonitor">Monitor</option>
                        <option id="typePeripherals">Peripherals</option>

                    </select>
                </div>  
                
                <div class="form-group">
                    <label for="assetStatus">
                        Status
                    </label>

                    <select id="assetStatus" class="statusSelect">
                        <option id="statusActive">Active</option>
                        <option id="statusInactive">Inactive</option>
                        <option id="statusRepairing">Repairing</option>
                        <option id="statusRetired">Retired</option>
                        <option id="statusLost">Lost</option>
                                              
                    </select>
                </div>
            </fieldset>
            
            <!-- OWNER & LOCATION  ############################################ -->
            
            <fieldset class="formSection">
                <legend class="formLegends">Owner & Location</legend>
        
                <div class="form-group">
                    <label for="userSelect">
                        User
                    </label>
                    
                    <select id="userSelect" name="userSelect">
                        
                    </select>

                </div>
          
                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail"
                        readonly
                        disabled>
                </div>
                
                <div class="form-group">
                    <label for="location">
                        Location
                    </label>
                <select id="location" class="location">
                    <option id="allLocation">All Locations</option>
                    <option id="deployed">Deployed</option>
                    <option id="returned">Returned</option>
                    <option id="comms">Comms</option>
                    <option id="trainingRoom">Training Room</option>
                    <option id="meetingPod">Meeting Pod</option>
                </select>
                </div>
       
            </fieldset>
              
            <!-- NOTES ############################### -->
                                
            <fieldset class="description">
                <!--Item 7-->
                <div class="form-group">
                    <label for="notes">
                        Additional Notes
                    </label>

                    <textarea class="notes"
                        id="notes"
                        name="notes">
                    </textarea>

                </div>
            </fieldset>
            </div>

            <!-- WARRANTY######################### -->
      
            <div id="warrantyTab" class="tabcontent">          
             <fieldset class="formSection">
                <legend class="formLegends">Warranty</legend>
                <!--Item 7-->
                <div class="form-group">
                    <label for="warrantyDetails">
                        Warranty Details
                    </label>

                    <input
                        type="text"
                        id="warrantyDetails"
                        name="warrantyDetails">
                </div>
                                                  
                <div class="form-group">
                    <label for="warrantyExpiryDate">
                        Warranty Expiry Date
                    </label>

                    <input
                        type="date"
                        id="warrantyExpiryDate"
                        name="warrantyExpiryDate">

                </div>
                     
                <!--Item 7-->
                <div class="form-group">
                    <label for="warrantyDocs">
                        Warranty Docs
                    </label>

                    <input
                        type="file"
                        id="warrantyDocs"
                        name="warrantyDocs">
                </div>
            </fieldset>           
            </div>
            
            <!-- Financial############################## -->
            <div id="financialTab" class="tabcontent">          
             <fieldset class="formSection">
                 
                <legend class="formLegends">Financial</legend>
                               
                <div class="form-group">
                    <label for="acquisitionDate">
                        Acquisition Date
                    </label>

                    <input
                        type="date"
                        id="acquisitionDate"
                        name="acquisitionDate">
                </div>
                                               
                <div class="form-group">
                    <label for="acquisitionValue">
                        Acquisition Value
                    </label>

                    <input
                        type="number"
                        id="acquisitionValue"
                        name="acquisitionValue"
                        step="0.01"
                        min="0"
                        >
                </div>
        
                <div class="form-group">
                    <label for="usefulLife">
                        Useful Life (Years)
                    </label>

                    <input
                        type="number"
                        id="usefulLife"
                        name="usefulLife">
                </div>
                
                <div class="form-group">
                    <label for="depreciation">
                        Depreciation
                    </label>

                    <input
                        type="number"
                        id="depreciation"
                        name="depreciation"
                        step="0.01"
                        min="0"
                        readonly
                        disabled
                        >
                </div>
  
                <div class="form-group">
                    <label for="netValue">
                        Net Value
                    </label>

                    <input
                        type="number"
                        id="netValue"
                        name="netValue"
                        step="0.01"
                        min="0"
                        readonly
                        disabled
                        >
                </div>
                
                <!--Item 7-->
                <div class="form-group">
                    <label for="purchaseInvoice">
                        Purchase Invoice
                    </label>

                    <input
                        type="file"
                        id="purchaseInvoice"
                        name="purchaseInvoice">
                </div>
            </fieldset> 
            </div>
            
            <!-- Maintenance ############################## -->

            <div id="maintenanceTab" class="tabcontent">
                <div id="main-content">
                    
                    <fieldset>
                    
                    <legend class="formLegends">
                        History
                    </legend>                    

                    <table class="allAssets" id="maintenanceHistoryTable">

                        <thead class="tableHeader">

                            <tr>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Maintenance ID</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Issue/Service</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Type</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Status</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Issue Date</span>
                                    </div>
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tableBodyMaintenance" class="tableBodyMaintenance">
                        </tbody>

                    </table>

                </fieldset>
                </div>
            </div>
                         
            <!-- buttons-->
               
                <div class="formButtons">
                     
                    <button type="button" id="close" onclick="closeViewAsset()">
                        Close
                    </button>               
                    
                    <button type="submit" id="resave" class="resave">
                        Save Asset
                    </button>                     
      
                </div>          
        </form>
    </div>
   
</div>
