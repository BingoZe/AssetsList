<div class="mainPage">
    
    <div class="mainHeader">
        
        <div class="headerTitle">
            <h2>VIEW ASSET</h2>
        </div>
        
        <div class="headerNav">
            <ul class="headerUl">

                <li>
                    <a href="#" class="tablinks"
                       onclick="openTab(event,'generalTab')">
                        General
                    </a>
                </li>

                <li>
                    <a href="#" class="tablinks"
                       onclick="openTab(event,'warrantyTab')">
                        Warranty
                    </a>
                </li>

                <li>
                    <a href="#" class="tablinks"
                       onclick="openTab(event,'financialTab')">
                        Financial
                    </a>
                </li>

                <li>
                    <a href="#" class="tablinks"
                       onclick="openTab(event,'maintenanceHistory')">
                        Maintenance History
                    </a>
                </li>

                <li>
                    <a href="#" class="tablinks"
                       onclick="openTab(event,'assetHistory')">
                        Asset History
                    </a>
                </li>

            </ul>
        </div>
        
    </div>
    
    <div class="formContainer">
        <form class="asset-form">
            <div id="generalTab" class="tabcontent">
                
            <!-- GENERAL INFO   ################################################################### -->
            
            <fieldset class="formSection">
                <legend class="formLegends">General Information</legend>
                
                <div class="form-group">
                    <label for="assetId">
                        Asset ID
                    </label>

                    <input type="text" 
                           id="assetId"
                           name="assetId"
                           readonly 
                           disabled>
                </div>

                <div class="form-group">
                    <label for="assetName">
                        Asset Name
                    </label>

                    <input
                        type="text"
                        id="assetName"
                        name="assetName"
                        >
                </div>

                <div class="form-group">
                    <label for="serviceTag">
                        Service Tag
                    </label>

                    <input
                        type="text"
                        id="serviceTag"
                        name="serviceTag"
                        >
                </div>

                <div class="form-group">
                    <label for="specsSelect">
                        Model/Family group
                    </label>
                    
                    <select id="specsSelect" name="specsSelect">
                        </select>
                </div>
                 
                <div class="form-group">
                    <label for="typeSelect">
                        Type
                    </label>
                    <select id="typeSelect" name="typeSelect">
                        </select>
                </div>  

                <div class="form-group">
                    <label for="statusSelect">
                        Status
                    </label>
                        <select id="statusSelect" name="statusSelect">
                            </select>
                </div>
            </fieldset>
            
            <!-- OWNER & LOCATION  ################################################################### -->                 
            <fieldset class="formSection">
                <legend class="formLegends">Owner & Location</legend>
              
                <div class="form-group">
                    <label for="userSelect">
                        User
                    </label>
                    <select id="userSelect" name="userSelect">
                        </select>

                </div>
                
                <div class="form-group">
                    <label for="userEmail">
                        User E-mail
                    </label>

                    <input
                        type="text"
                        id="userEmail"
                        name="userEmail"
                        readonly 
                        disabled>
                </div>
                
                <div class="form-group">
                    <label for="locationSelect">
                        Location
                    </label>
                    <select id="locationSelect" name="locationSelect">
                        </select>                        
                </div>

        
            </fieldset>
                       
             <!-- NOTES ################################################################### -->    
                        
            <fieldset class="description">
                
                <div class="form-group">
                    <label for="notes">
                        Additional Notes
                    </label>

                    <textarea class="notes"
                        id="notes"
                        name="notes">
                    </textarea>

                </div>
            </fieldset>
            </div>
            
            <!-- WARRANTY#####  ################################################################### -->
            
            <div id="warrantyTab" class="tabcontent">          
             <fieldset class="formSection">
                <legend class="formLegends">Warranty</legend>
                <!--Item 7-->
                <div class="form-group">
                    <label for="warrantyDetails">
                        Warranty Details
                    </label>

                    <input
                        type="text"
                        id="warrantyDetails"
                        name="warrantyDetails">

                </div>

                <div class="form-group">
                    <label for="warrantyExpiryDate">
                        Warranty Expiry Date
                    </label>

                    <input
                        type="date"
                        id="warrantyExpiryDate"
                        name="warrantyExpiryDate"
                        >

                </div>

                <div class="form-group">
                    <label for="warrantyDocs">
                        Warranty Docs
                    </label>

                    <input
                        type="text"
                        id="warrantyDocs"
                        name="warrantyDocs">

                </div>
            </fieldset>           
            </div>
            
            <!-- Financial#####  ################################################################### -->

            <div id="financialTab" class="tabcontent">          
             <fieldset class="formSection">
                 
                <legend class="formLegends">Financial</legend>
                              
                <div class="form-group">
                    <label for="acquisitionDate">
                        Acquisition Date
                    </label>

                    <input
                        type="date"
                        id="acquisitionDate"
                        name="acquisitionDate">
                </div>

                <div class="form-group">
                    <label for="acquisitionValue">
                        Acquisition Value
                    </label>

                    <input
                        type="number"
                        id="acquisitionValue"
                        name="acquisitionValue"
                        step="0.01"
                        min="0"
                        >
                </div>

                <div class="form-group">
                    <label for="usefulLife">
                        Useful Life (Years)
                    </label>

                    <input
                        type="text"
                        id="usefulLife"
                        name="usefulLife">
                </div>
                
                <div class="form-group">
                    <label for="depreciation">
                        Depreciation
                    </label>

                    <input
                        type="number"
                        id="depreciation"
                        name="depreciation">
                </div>
                
                <div class="form-group">
                    <label for="netValue">
                        Net Value
                    </label>

                    <input
                        type="number"
                        id="netValue"
                        name="netValue">
                </div>

                <div class="form-group">
                    <label for="purchaseInvoice">
                        Purchase Invoice
                    </label>

                    <input
                        type="text"
                        id="purchaseInvoice"
                        name="purchaseInvoice">

                </div>
            </fieldset> 
            </div>
            
            <!-- ################################################################### -->
            <!-- MAINTENANCE HISTORY -->
            <!-- ################################################################### -->

            <div id="maintenanceHistory" class="tabcontent">

                <fieldset>

                    <legend class="formLegends">
                        Maintenance History
                    </legend>

                    <table class="allAssets" id="maintenanceHistoryTable">

                        <thead class="tableHeader">

                            <tr>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Maintenance ID</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Issue</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Status</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Open Date</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Close Date</span>
                                    </div>
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tableBodyMaintenance" class="tableBodyMaintenance">
                        </tbody>

                    </table>

                </fieldset>

            </div>

            <!-- ################################################################### -->
            <!-- ASSET HISTORY -->
            <!-- ################################################################### -->

            <div id="assetHistory" class="tabcontent">

                <fieldset>

                    <legend class="formLegends">
                        Asset History
                    </legend>

                    <table class="allAssets" id="assetHistoryTable">

                        <thead class="tableHeader">

                            <tr>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">User ID</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">User</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">Status</span>
                                    </div>
                                </th>

                                <th>
                                    <div class="tableHeaderElement">
                                        <span class="thTitle">A SER IMPLEMENTADO</span>
                                    </div>
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tableBodyAssetHistory" class="tableBodyAssetHistory">
                        </tbody>

                    </table>

                </fieldset>

            </div>

                <div class="formButtons">
                    
                    <button type="button" id="close" onclick="closeViewAsset()">
                        Close
                    </button>    
                    
                    <button type="submit" id="resave" class="resave">
                        Save Asset
                    </button>
                </div>
                
        </form>
    </div>
    
    
    
</div>
