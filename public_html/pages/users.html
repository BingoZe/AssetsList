                                  text-anchor="middle"
                                  font-size="24"
                                  fill="#4E73DF"

                    </div>

        <div class="searchNav">

            <div class="searchNavElement">

            </div>
            
            <div class="searchNavElement">

                    <option id="statusActive">Active</option>
                    <option id="statusInactive">Inactive</option>
                </select>
            </div>
