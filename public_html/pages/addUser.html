<div class="mainPage">
    
    <div class="mainHeader">

        <div class="headerTitle">
            <h2>Add User</h2>
        </div>
        
        <div class="headerNav">
            <ul class ="headerUl">
                <li>User General info</li>
            </ul>
        </div>
    </div>
    
    <div class="assetContainer">
        <form class="user-form">
            <div id="generalTab" class="tabcontent">
            <!-- ################################################################################## -->
            <!-- GENERAL INFO   ################################################################### -->
            <!-- ################################################################################## -->
            <fieldset class="generalInfo">
                <legend class="formLegends">General Information</legend>
               
                <div class="form-group">
                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        name="employeeId">
                </div>
                
                <div class="form-group">
                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        required>
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        required>
                </div>

                <div class="form-group">
                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail">
                </div>   

                 
                <div class="form-group">
                    <label for="type">
                        Status
                    </label>

                    <select id="type" class="typeSelect">
                        <option id="typeLaptop">Active</option>
                        <option id="typeMobile">Mobile</option>
                        <option id="typeServer">Server</option>
                        <option id="typeVirtualDesktop">Virtual Desktop</option>
                        <option id="typeDesktop">Desktop</option>
                        <option id="typeMonitor">Monitor</option>
                        <option id="typePeripherals">Peripherals</option>
                    </select>
                </div>  
                
                
               <div class="form-group">
                    <label for="user">
                        Department
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        required>
                </div>
                
               <div class="form-group">
                    <label for="user">
                        Role
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        required>
                </div>
                  
            </fieldset>
            
            </div>
            
                <div class="formButtons">
                    
                    <button type="button" id="close" onclick="closeViewAsset()">
                        Close
                    </button>    
                    
                    <button type="submit">
                        Save
                    </button>
                </div>
                
        </form>
    </div>
    
    
    
</div>
