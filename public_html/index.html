<!DOCTYPE html>
<html lang="en">

<head>

    <title>DwemerWorks</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">

    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
    <script src="js/openTab.js"></script>
    
    <script src="js/assetService.js"></script>
    <script src="js/userService.js"></script>
    <script src="js/maintenanceService.js"></script>     
    <script src="js/specsService.js"></script>
    <script src="js/assetTypeService.js"></script>
    <script src="js/assetStatusService.js"></script>
    <script src="js/assetLocationService.js"></script>
    
    <script src="js/export.js"></script>
    <script src="js/exportCsv.js"></script>
    <script src="js/searchSorting.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/viewMode.js"></script>
    <script src="js/renderSelects.js"></script>
    <script src="js/renderInnerTables.js"></script>
    
   
    
    <script src="js/login.js"></script>
    <script src="js/session.js"></script>
    


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://kit.fontawesome.com/a53829a2f3.js" crossorigin="anonymous"></script>

    <script src="js/supabaseClient.js"></script>

</head>

<body>

    <div class="app-layout">

        <nav>

            <div class="sidebar-brand">

                <figure class="nav-logo"></figure>

                <span class="brand-title">
                    DWEMERWORKS
                </span>

            </div>

            <!-- MENU PRINCIPAL -->
            <ul class="nav-ul-items">

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/dashboard.html')">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/assetRegister.html')">
                        <i class="fa-solid fa-laptop"></i>
                        <span>Asset Register</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/maintenance.html')">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        <span>Maintenance</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/users.html')">
                        <i class="fa-solid fa-users"></i>
                        <span>Users</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/reports.html')">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Reports</span>
                    </a>
                </li>

            </ul>

            <!-- MENU INFERIOR -->
            <ul class="nav-ul-items nav-bottom">

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); loadPage('pages/settings.html')">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                       onclick="event.preventDefault(); signOut();">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Sign Out</span>
                    </a>
                </li>

            </ul>

        </nav>


        <div class="content-area">

            <header>

                <div class="notification">
                    <i class="fa-regular fa-bell"></i>
                </div>

                <div class="user-profile">
                    <i class="fa-regular fa-user"></i>
                </div>

            </header>

            <main id="main-content">

            </main>

        </div>

    </div>

</body>

</html>
